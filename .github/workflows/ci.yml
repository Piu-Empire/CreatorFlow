name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CreatorFlow.slnx

      - name: Build Release
        id: build
        run: dotnet build CreatorFlow.slnx --configuration Release --no-restore

      - name: Test API without database
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test tests/CreatorFlow.Api.Tests/CreatorFlow.Api.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName!~CreatorFlow.Api.Tests.Database"
          --logger "trx;LogFileName=api.trx" --results-directory TestResults/api

      - name: Test client without database or live API
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test tests/CreatorFlow.IntegrationTests/CreatorFlow.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName!~CreatorFlow.IntegrationTests.Database&TestCategory!=ApiLive"
          --logger "trx;LogFileName=client.trx" --results-directory TestResults/client

      - name: Validate and summarize test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $invalidResults = $false
          '## Test results' >> $env:GITHUB_STEP_SUMMARY
          '| Project | Executed | Passed | Failed | Skipped / not executed |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | ---: | ---: | ---: | ---: |' >> $env:GITHUB_STEP_SUMMARY
          foreach ($project in @('api', 'client')) {
            $report = "TestResults/$project/$project.trx"
            if (!(Test-Path -LiteralPath $report)) {
              "::error::Missing test report: $report"
              "| $project | Missing report | - | - | - |" >> $env:GITHUB_STEP_SUMMARY
              $invalidResults = $true
              continue
            }
            [xml]$trx = Get-Content -LiteralPath $report -Raw
            $counters = $trx.TestRun.ResultSummary.Counters
            if ($null -eq $counters) {
              "::error::Missing test counters: $report"
              $invalidResults = $true
              continue
            }
            $total = [int]$counters.total
            $executed = [int]$counters.executed
            $passed = [int]$counters.passed
            $failed = [int]$counters.failed
            $skipped = $total - $executed
            "| $project | $executed | $passed | $failed | $skipped |" >> $env:GITHUB_STEP_SUMMARY
            if ($executed -le 0 -or $passed -ne $total -or $failed -gt 0) {
              "::error::$project did not fully pass: total=$total executed=$executed passed=$passed failed=$failed skipped=$skipped"
              $invalidResults = $true
            }
          }
          if ($invalidResults) { exit 1 }

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
